  <line x1="68" y1="148" x2="68" y2="165" stroke="#30363d" stroke-width="1.5"/>
  <line x1="207" y1="148" x2="207" y2="165" stroke="#30363d" stroke-width="1.5"/>
  <line x1="346" y1="148" x2="346" y2="165" stroke="#30363d" stroke-width="1.5"/>

